937">Fast compiled SV feedback</text><rect x="60" y="530" width="210" height="49" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/><text x="165.0" y="558.875" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937">C++HDL</text><rect x="270" y="530" width="185" height="49" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/><text x="362.5" y="558.735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.1" font-weight="400" fill="#1F2937">C++</text><rect x="455" y="530" width="205" height="49" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/><text x="557.5" y="558.735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.1" font-weight="400" fill="#1F2937">Native C++ RTL</text><rect x="660" y="530" width="205" height="49" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/><text x="762.5" y="558.735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.1" font-weight="400" fill="#1F2937">SystemVerilog</text><rect x="865" y="530" width="270" height="49" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/><text x="1000.0" y="551.735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.1" font-weight="400" fill="#1F2937">Reflection + dual-domain;</text><text x="1000.0" y="565.735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.1" font-weight="400" fill="#1F2937">AI-agent question</text><text x="60" y="603" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">Yuri Panchul · Donald Soderman · Denis Coleman — inventors; patent priority 1997; US 6,226,776 / 6,848,085</text><text x="60" y="630" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Executable C/C++ RTL is old; the new question is what AI agents can do with the fast loop.</text><text x="60" y="655" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#475569">C++HDL is interesting as a modern implementation and testbed, not as a claim of historical firstness.</text></svg>