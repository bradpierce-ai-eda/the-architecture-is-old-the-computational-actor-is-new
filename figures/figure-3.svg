<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#FBFBF8"/><text x="42" y="48" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1F2937">Figure 3 — A lineage, not a rupture</text><text x="42" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Papers, patents, and industrial use document deep C/C++ RTL history; the AI-era question is what changes with a new user.</text><rect x="60" y="96" width="210" height="42" fill="#DBEAFE" stroke="#94A3B8"/><text x="165.0" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937">System</text><rect x="270" y="96" width="185" height="42" fill="#DBEAFE" stroke="#94A3B8"/><text x="362.5" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937">Host / source</text><rect x="455" y="96" width="205" height="42" fill="#DBEAFE" stroke="#94A3B8"/><text x="557.5" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937">Execution model</text><rect x="660" y="96" width="205" height="42" fill="#DBEAFE" stroke="#94A3B8"/><text x="762.5" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937">HDL output / role</text><rect x="865" y="96" width="270" height="42" fill="#DBEAFE" stroke="#94A3B8"/><text x="1000.0" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937">Notable emphasis</text><rect x="60" y="138" width="210" height="49" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="165.0" y="166.875" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-we