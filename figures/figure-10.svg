<svg baseProfile="full" height="700" version="1.1" viewBox="0 0 1200 700" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8" /></marker><marker id="arrowBlue" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8" /></marker><marker id="arrowRed" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C" /></marker></defs><rect fill="#FBFBF8" height="700" width="1200" x="0" y="0" /><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" x="42" y="48">Figure 10 — Evolution by addition</text><rect fill="#CCFBF1" height="80" rx="14" ry="14" stroke="#0F766E" stroke-width="2" width="220" x="90" y="120" /><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" x="200.0" y="164.27499999999998">C++HDL</text><rect fill="#DBEAFE" height="80" rx="14" ry="14" stroke="#1D4ED8" stroke-width="2" width="220" x="360" y="120" /><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" x="470.0" y="164.27499999999998">Direct SystemVerilog</text><rect fill="#F3E8FF" height="80" rx="14" ry="14" stroke="#7E22CE" stroke-width="2" width="220" x="660" y="120" /><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" x="770.0" y="153.35">Other future</text><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" x="770.0" y="175.2">development layers</text><rect fill="#DCFCE7" height="90" rx="14" ry="14" stroke="#15803D" stroke-width="2" width="580" x="310" y="270" /><text fill="#1F293