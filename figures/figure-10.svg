t="62" rx="14" ry="14" stroke="#94A3B8" stroke-width="2" width="155" x="790" y="435" /><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="867.5" y="469.15">Timing</text><line marker-end="url(#arrow)" stroke="#94A3B8" stroke-width="1.8" x1="600" x2="867" y1="360" y2="435" /><rect fill="#F1F5F9" height="62" rx="14" ry="14" stroke="#94A3B8" stroke-width="2" width="155" x="970" y="435" /><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="1047.5" y="461.09999999999997">Physical design /</text><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="1047.5" y="477.2">signoff</text><line marker-end="url(#arrow)" stroke="#94A3B8" stroke-width="1.8" x1="600" x2="1047" y1="360" y2="435" /><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" x="600" y="540">Humans and AI agents can choose a productive development habitat without requiring the rest of the organization to convert.</text><rect fill="#EEF2FF" height="62" rx="14" ry="14" stroke="#C7D2FE" stroke-width="1.5" width="1128" x="36" y="612" /><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="60" y="642.0">The plausible future is not C++ replacing SystemVerilog, but new development layers feeding the boundary</text><text fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="60" y="662.7">the hardware industry already trusts.</text></svg>